{% extends 'base.html' %}{% block title %}编辑文章 · AnRainStudio{% endblock %}{% block content %}<div class="editor"><a class="back-link" href="{{ url_for('admin') }}">← 返回后台</a><div class="form-shell glass"><div class="eyebrow">EDITOR <span class="slash">//</span> 发布内容</div><h1>{{ '编辑文章' if is_edit else '新建文章' }} <span>✳</span></h1><p>正文按输入的换行展示；链接请填写完整地址。</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>标题 <input name="title" maxlength="200" value="{{ post.title if post else '' }}" required></label><div class="form-grid"><label>分类 <select name="category" required>{% for value in ['Android 16','Android 17','类原生','官改 ROM','官改','移植 ROM','应用移植','移植'] %}<option value="{{ value }}" {% if post and post.category == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label><label>版本 <input name="version" maxlength="100" value="{{ post.version if post else '' }}" placeholder="例如：第二版"></label></div><div class="form-grid"><label>发布日期 <input name="published_at" type="date" value="{{ post.published_at if post else today }}" required></label><label>下载链接 <input name="download_url" type="url" value="{{ post.download_url if post else '' }}" placeholder="https://..."></label></div><div class="form-grid"><label>额外链接（可选） <input name="extra_url" type="url" value="{{ post.extra_url if post else '' }}" placeholder="底包、设备树等链接"></label><label>额外链接名称 <input name="extra_label" maxlength="60" value="{{ post.extra_label if post else '' }}" placeholder="例如：设备树、C.701 底包"></label></div><label>摘要 <textarea name="summary" maxlength="500" rows="3" required>{{ post.summary if post else '' }}</textarea></label><label>正文 <textarea name="body" maxlength="30000" rows="16" required>{{ post.body if post else '' }}</textarea></label><label class="checkbox"><input type="checkbox" name="show_donation" value="1" {% if post and post.show_donation %}checked{% endif %}> 在本篇文章下方显示捐赠弹窗入口</label><div class="editor-actions"><button class="button primary" type="submit">保存文章 ↗</button><a class="button ghost" href="{{ url_for('admin') }}">取消</a></div></form></div></div>{% endblock %}
